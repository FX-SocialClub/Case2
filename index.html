<style>
:root{
  --g:#39ff14;--g2:rgba(57,255,20,0.7);--g3:rgba(57,255,20,0.25);
  --g4:rgba(57,255,20,0.08);--glow:0 0 20px #39ff14,0 0 40px rgba(57,255,20,0.4);
  --black:#000;--dark:#060606;--card:rgba(10,10,10,0.85);
  --border:rgba(57,255,20,0.15);--white:#f0f0f0;--grey:#888;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--black);color:var(--white);
  overflow-x:hidden;cursor:none;
}

/* Cursor (оставлен без изменений) */
.cur{
  position:fixed;z-index:9999;pointer-events:none;
  width:14px;height:14px;border:1px solid var(--g);
  transform:translate(-50%,-50%);
  box-shadow:var(--glow);transition:width .15s,height .15s;
  top:0;left:0;
}
.cur::after{
  content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:3px;height:3px;background:var(--g);
  box-shadow:var(--glow);
}
.cur.big{width:44px;height:44px;}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 48px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
}

/* Новый контейнер для лого и текста */
.logo-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo{
  font-family:'Space Mono',monospace;font-size:16px;font-weight:700;
